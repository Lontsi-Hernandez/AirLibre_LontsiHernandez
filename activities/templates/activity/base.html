<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mon site{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">Air Libre</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">

                <!-- Filtres de vue -->
                <form method="get" class="d-flex align-items-center me-3">
                    <input type="hidden" name="categorie" value="{{ selected_categorie }}">
                    
                   
                    {% if user.is_authenticated %}
                    <a class="btn btn-sm" href="{% url 'mes_activites' user.id%}">Mes activites</a>
                    <a class="btn btn-sm" href="{% url 'mes_inscriptions' user.id%}">Mes inscriptions</a>
                        <a href="{% url 'ajouter_activite' %}" class="btn btn-sm me-1">Ajouter activite</button>
                        <button type="submit" name="vue" value="inscriptions" class="btn btn-sm {% if vue == 'inscriptions' %}btn-primary{% else %}btn-outline-primary{% endif %}">Mes inscriptions</button>
                    {% endif %}
                </form>

                <!-- Filtre catégories -->
                <form method="get" class="d-flex align-items-center">
                    <input type="hidden" name="vue" value="{{ vue }}">
                    <select name="categorie" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="">Toutes les catégories</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if cat.id|stringformat:"s" == selected_categorie %}selected{% endif %}>{{ cat.nom }}</option>
                        {% endfor %}
                    </select>
                </form>
            </ul>

            <!-- Authentification -->
            <ul class="navbar-nav">
                {% if not user.is_authenticated %}
                    <li class="nav-item">
                        <a class="btn btn-primary me-2" href="{% url 'signup' %}">S'inscrire</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-primary" href="{% url 'connexion' %}">Se connecter</a>
                    </li>
                {% else %}
                    <li class="nav-item me-2">
                        <a href="">
                            <img src="{{ user.avatar.url }}" alt="avatar" class="rounded-circle" width="32" height="32">
                            {{ user.username }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger" href="{% url 'deconnexion' %}">Se déconnecter</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
